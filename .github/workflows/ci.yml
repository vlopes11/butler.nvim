name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10

      - uses: extractions/setup-just@v4

      # Test sockets live under the checkout and must fit Linux's 108-byte limit.
      - name: Prepare a short checkout path
        run: cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/butler"

      - name: Run checks
        working-directory: ${{ runner.temp }}/butler
        run: just check
