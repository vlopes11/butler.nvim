name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install just
        env:
          JUST_VERSION: "1.59.0"
          JUST_SHA256: "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e"
        run: |
          install_dir="$RUNNER_TEMP/just-$JUST_VERSION"
          mkdir -p "$install_dir"
          archive="$install_dir/just.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir" just
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/just" --version

      - name: Run checks
        run: just check
